<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Signature – Norman MARIE-MARTHE | Cyberun</title>
<!--
  Signature e-mail Cyberun – version moderne & interactive
  ---------------------------------------------------------
  • Tous les styles essentiels sont en ligne (compatibles Gmail, Outlook, Apple Mail, Thunderbird).
  • Le bloc <style> ajoute des effets de survol (hover) dans les clients qui le supportent
    (Apple Mail, Outlook Mac/Web, Thunderbird…). Ailleurs, la signature reste propre et cliquable.
  • LOGO : <picture> affiche le SVG (Apple Mail, iOS, Outlook Mac/Web…) et bascule automatiquement sur le PNG HD
    là où le SVG n'est pas supporté (Gmail, Outlook Windows). Les logos sont hébergés via GitHub Pages
    (https://coolj974.github.io/signature-mail-cyberun/).
  • Installation : ouvrez ce fichier dans un navigateur, sélectionnez la signature (Ctrl+A), copiez (Ctrl+C)
    puis collez-la dans les paramètres de signature de votre messagerie.
-->
<style>
  .cy-btn { transition: background-color .25s ease, color .25s ease, box-shadow .25s ease; }
  .cy-btn:hover { background-color: #1A6AA6 !important; color: #ffffff !important; box-shadow: 0 4px 12px rgba(37,129,196,.35); }
  .cy-btn-ghost:hover { background-color: #2581C4 !important; color: #ffffff !important; }
  .cy-link { transition: color .2s ease; }
  .cy-link:hover { color: #1A6AA6 !important; text-decoration: underline !important; }
  .cy-logo { transition: transform .3s ease; }
  .cy-logo:hover { transform: scale(1.04); }
</style>
</head>
<body style="margin:0;padding:24px;background:#f4f6f9;">

<!-- ===== DÉBUT DE LA SIGNATURE ===== -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation"
       style="width:600px;max-width:100%;background:#ffffff;border-radius:10px;
              box-shadow:0 6px 20px rgba(0,0,0,.08);font-family:'Segoe UI',Arial,Helvetica,sans-serif;
              border-collapse:separate;overflow:hidden;">
  <tr>
    <!-- Colonne logo -->
    <td valign="middle" align="center" style="padding:22px 22px 18px 26px;width:230px;">
      <a href="https://cyberun.info" target="_blank" style="text-decoration:none;">
        <picture>
          <source srcset="https://coolj974.github.io/signature-mail-cyberun/logo-cyberun.svg" type="image/svg+xml">
          <img class="cy-logo" src="https://coolj974.github.io/signature-mail-cyberun/logo-cyberun.png" width="210" height="68" alt="Cyberun – Innovation &amp; Tradition"
             style="display:block;width:210px;height:auto;border:0;">
        </picture>
      </a>
      <a class="cy-link" href="https://cyberun.info" target="_blank"
         style="display:inline-block;margin-top:8px;font-size:14px;font-weight:700;color:#2581C4;text-decoration:none;letter-spacing:.3px;">
        cyberun.info
      </a>
    </td>

    <!-- Séparateur vertical dégradé (rappel de l'ombre de l'original) -->
    <td style="width:4px;padding:18px 0;">
      <div style="width:4px;height:120px;border-radius:4px;
                  background:#2581C4;background:linear-gradient(180deg,#1B9CD8 0%,#2581C4 100%);"></div>
    </td>

    <!-- Colonne coordonnées -->
    <td valign="middle" style="padding:20px 26px 20px 24px;">
      <div style="font-size:18px;font-weight:700;color:#111111;line-height:22px;">
        Norman <span style="letter-spacing:.5px;">MARIE-MARTHE</span>
      </div>
      <div style="font-size:14px;color:#2581C4;line-height:20px;margin-top:2px;">
        Développeur Multimédia
      </div>

      <div style="margin-top:12px;font-size:13px;line-height:20px;color:#333333;">
        <img src="https://coolj974.github.io/signature-mail-cyberun/icons/mail.png" width="14" height="14" alt="" style="width:14px;height:14px;border:0;vertical-align:-2px;">&nbsp;&nbsp;
        <a class="cy-link" href="mailto:norman.marie-marthe@cyberun.info"
           style="color:#333333;text-decoration:none;">norman.marie-marthe@cyberun.info</a>
      </div>

      <!-- Boutons d'action -->
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="margin-top:14px;">
        <tr>
          <td style="padding-right:8px;">
            <a class="cy-btn" href="mailto:norman.marie-marthe@cyberun.info" target="_blank"
               style="display:inline-block;padding:8px 16px;background:#2581C4;color:#ffffff;
                      font-size:12px;font-weight:700;text-decoration:none;border-radius:20px;">
              M'écrire
            </a>
          </td>
          <td>
            <a class="cy-btn cy-btn-ghost" href="https://cyberun.info" target="_blank"
               style="display:inline-block;padding:7px 15px;background:#ffffff;color:#2581C4;
                      font-size:12px;font-weight:700;text-decoration:none;border-radius:20px;border:1px solid #2581C4;">
              <img src="https://coolj974.github.io/signature-mail-cyberun/icons/play.png" width="12" height="12" alt="" style="width:12px;height:12px;border:0;vertical-align:-1px;">&nbsp;Découvrir Cyberun
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Bandeau inférieur -->
  <tr>
    <td colspan="3" style="background:#2581C4;background:linear-gradient(90deg,#2581C4 0%,#1B9CD8 100%);
                           padding:7px 26px;font-size:11px;color:#ffffff;letter-spacing:1.5px;text-transform:uppercase;">
      Innovation &amp; Tradition
    </td>
  </tr>
</table>
<!-- ===== FIN DE LA SIGNATURE ===== -->

</body>
</html>
